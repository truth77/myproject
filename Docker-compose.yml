services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bible-frontend
    ports:
      - "3002:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://backend:3000
    volumes:
      - ./client/build:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - bible-network
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bible-backend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=C00kies!!!
      - DB_NAME=bible
      - DATABASE_URL=postgresql://postgres:C00kies!!!@postgres:5432/bible
      - JWT_SECRET=your-jwt-secret
      - CORS_ORIGIN=http://localhost:3002,http://frontend:3000
      - PORT=3000
      - DISABLE_MEMORY_MONITORING=true
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bible-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: bible-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=C00kies!!!
      - POSTGRES_DB=bible
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bible-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bible"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  bible-network:
    driver: bridge

volumes:
  postgres_data:
